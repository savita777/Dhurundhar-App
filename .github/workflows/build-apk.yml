# ═══════════════════════════════════════════════════════════════════════════════
#  .github/workflows/build-apk.yml
#  DHURANDHAR (2025) — Android APK Build Pipeline
#
#  Trigger  :  every push to every branch + PRs targeting main / master
#  Runner   :  ubuntu-22.04
#  Output   :  downloadable *.apk artifact in the Actions → Artifacts tab
#
#  ⚠  First run (cold cache) takes ~25-45 min — SDK & NDK are ~2.5 GB.
#     Subsequent runs with cache restore in ~8-15 min.
# ═══════════════════════════════════════════════════════════════════════════════

name: "📱 Build Dhurandhar APK"

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - "**"                         # every branch, every push
  pull_request:
    branches:
      - main
      - master

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  build-apk:
    name: "🔨 Buildozer — Android Debug APK"
    runs-on: ubuntu-22.04
    timeout-minutes: 90              # safety net; cold build ~45 min

    steps:

      # ── 1 · Checkout ─────────────────────────────────────────────────────
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4

      # ── 2 · Python 3.10 ──────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3 · Java 17  (required by Android SDK build-tools) ───────────────
      - name: "☕ Set up Java 17 (Temurin)"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 4 · System packages ───────────────────────────────────────────────
      #   These are the packages Buildozer/p4a need on a fresh Ubuntu runner.
      #   Grouped by purpose for readability.
      - name: "📥 Install system dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            # ── General build tools ──────────────────────────────────────────
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            cmake \
            autoconf \
            libtool \
            pkg-config \
            # ── Python build helpers ─────────────────────────────────────────
            python3-pip \
            python3-setuptools \
            # ── Crypto / TLS ─────────────────────────────────────────────────
            libssl-dev \
            libffi-dev \
            # ── SDL2 (Kivy's rendering backend on Android) ───────────────────
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            # ── Audio / Video (ffmpeg stack) ──────────────────────────────────
            ffmpeg \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libportmidi-dev \
            # ── GStreamer (Kivy audio on desktop; p4a handles Android side) ───
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            # ── OpenGL / GLEW ─────────────────────────────────────────────────
            libglew-dev \
            # ── ncurses (needed by older NDK toolchain binaries) ──────────────
            libncurses5-dev \
            libncursesw5-dev \
            # ── zlib ─────────────────────────────────────────────────────────
            zlib1g-dev

      # ── 5 · Python packages ───────────────────────────────────────────────
      - name: "📦 Install Buildozer and Cython"
        run: |
          pip3 install --upgrade pip setuptools wheel
          # Cython 3.x is compatible with modern Kivy + p4a recipes
          pip3 install buildozer cython

      # ── 6 · Cache (SDK / NDK / p4a builds) ───────────────────────────────
      #   Key on buildozer.spec content — changing requirements busts cache.
      - name: "💾 Cache Buildozer global directory (~/.buildozer)"
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ── 7 · Build APK ────────────────────────────────────────────────────
      - name: "🏗️ Run Buildozer — android debug"
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  DHURANDHAR (2025) — APK Build Initiated"
          echo "  Agent : Hamza Ali Mazari  |  Codename : PHANTOM"
          echo "  Target: Android Debug APK (arm64-v8a + armeabi-v7a)"
          echo "═══════════════════════════════════════════════════════"
          buildozer -v android debug 2>&1
          echo "═══════════════════════════════════════════════════════"
          echo "  Build complete — scanning output directory ..."
          echo "═══════════════════════════════════════════════════════"
          ls -lh bin/ || (echo "❌  bin/ directory not found — build may have failed." && exit 1)

      # ── 8 · Upload APK artifact ───────────────────────────────────────────
      - name: "📤 Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "dhurandhar-debug-apk"
          path: "bin/*.apk"
          retention-days: 30         # keep for 30 days in Actions tab
          if-no-files-found: error   # fail the job if no APK was produced

      # ── 9 · Mission status (only on success) ─────────────────────────────
      - name: "🎯 Mission Status Report"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║  STATUS   :  APK BUILD SUCCESSFUL                     ║"
          echo "║  ARTIFACT :  dhurandhar-debug-apk                     ║"
          echo "║  HOW      :  Actions tab → your run → Artifacts ↓     ║"
          echo "║  INSTALL  :  Enable 'Unknown sources' on your Android  ║"
          echo "║             device, then open the downloaded .apk      ║"
          echo "╚═══════════════════════════════════════════════════════╝"

      # ── 10 · On failure: show tail of buildozer log ───────────────────────
      - name: "🔍 Show Buildozer log on failure"
        if: failure()
        run: |
          echo "──────────────────────────────────────────────────────────"
          echo "  BUILD FAILED — last 100 lines of .buildozer/logs/ :"
          echo "──────────────────────────────────────────────────────────"
          find .buildozer/logs -name "*.log" 2>/dev/null \
            | sort -t_ -k2 -n \
            | tail -1 \
            | xargs tail -100 2>/dev/null \
            || echo "  (no log file found — check step output above)"
            
