# ═══════════════════════════════════════════════════════════════════════════════
#  .github/workflows/build-apk.yml
#  DHURANDHAR (2025) — Official Kivy Buildozer Pipeline
# ═══════════════════════════════════════════════════════════════════════════════

name: "📱 Build Dhurandhar APK"

on:
  push:
    branches:
      - "**"

jobs:
  build-apk:
    name: "🔨 Kivy Official Buildozer"
    runs-on: ubuntu-latest

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4

      - name: "🏗️ Run Official Buildozer Action"
        uses: kivy/buildozer-action@v2
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: "📤 Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "dhurandhar-debug-apk"
          path: bin/*.apk
          if-no-files-found: error
          
