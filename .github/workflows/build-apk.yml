# ═══════════════════════════════════════════════════════════════════════════════
#  .github/workflows/build-apk.yml
#  DHURANDHAR (2025) — Android APK Build Pipeline
# ═══════════════════════════════════════════════════════════════════════════════

name: "📱 Build Dhurandhar APK"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: "🔨 Buildozer — Android Debug APK"
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "☕ Set up Java 17 (Temurin)"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "📥 Install system dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            cmake \
            autoconf \
            libtool \
            pkg-config \
            python3-pip \
            python3-setuptools \
            libssl-dev \
            libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            ffmpeg \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libportmidi-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libglew-dev \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev

      - name: "📦 Install Buildozer and Cython"
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install buildozer cython

      - name: "💾 Cache Buildozer global directory"
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: "🏗️ Run Buildozer — android debug"
        run: |
          buildozer -v android debug 2>&1
          ls -lh bin/ || (echo "❌  bin/ directory not found" && exit 1)

      - name: "📤 Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "dhurandhar-debug-apk"
          path: "bin/*.apk"
          retention-days: 30
          if-no-files-found: error
          
